profile_name: dev_mock
mode: development

camera:
  type: mock
  frame_width: 2048
  frame_height: 1364
  pixel_format: mono8
  frame_rate_hz: 10
  synthetic_target: balloon_envelope

runtime:
  run_output_dir: runs
  log_level: info

frontend:
  preview_max_width: 1024
  preview_max_height: 682

temperature_controller:
  type: mock
  enabled: true
  initial_temperature_c: 20.0
  ramp_rate_c_per_min: 2.0
  allow_set_target: true
  allow_set_power: true
  initial_target_temperature_c: 45.0
  initial_power_percent: 0.0
  output_enabled: false
